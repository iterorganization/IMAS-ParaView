title: Plot over line in core and edge plasma
author: S. Korving
description: |
  This example shows how to apply the `Plot Over Line` filter to visualize the
  electron temperature in the edge and core plasma from a JINTRAC simulation. 
  In the edge, the electron temperature is loaded from an ``edge_profiles`` GGD grid. 
  In the core, the 1D profile from ``core_profiles`` is mapped onto a 2D grid, 
  using the :ref:`2D Profiles Reader <using the 2d Profiles Reader>`.
